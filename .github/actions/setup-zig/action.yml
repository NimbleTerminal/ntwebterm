name: 'Setup Zig'
description: 'Install Zig compiler'
inputs:
  version:
    description: 'Zig version to install'
    required: true
    default: '0.17.0'
runs:
  using: 'composite'
  steps:
    - name: Cache Zig
      uses: actions/cache@v5
      id: cache-zig
      with:
        path: |
          ~/zig
        key: zig-${{ runner.os }}-${{ inputs.version }}

    - name: Download and install Zig
      if: steps.cache-zig.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        VERSION="${{ inputs.version }}"

        # Determine platform
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          PLATFORM="linux"
          ARCH="x86_64"
        elif [[ "$OSTYPE" == "darwin"* ]]; then
          PLATFORM="macos"
          if [[ "$(uname -m)" == "arm64" ]]; then
            ARCH="aarch64"
          else
            ARCH="x86_64"
          fi
        else
          echo "Unsupported OS: $OSTYPE"
          exit 1
        fi

        # Download from ziglang.org
        # Note: Format changed in 0.14.1+ from zig-linux-x86_64 to zig-x86_64-linux
        TARBALL="zig-${ARCH}-${PLATFORM}-${VERSION}.tar.xz"
        URL="https://ziglang.org/download/${VERSION}/${TARBALL}"

        echo "Downloading Zig ${VERSION} for ${PLATFORM}-${ARCH}..."
        curl --retry 3 --retry-delay 5 -fL -o "/tmp/${TARBALL}" "${URL}"

        # Verify SHA-256 digest against pinned release hashes
        case "${VERSION}:${ARCH}-${PLATFORM}" in
          "0.17.0:x86_64-linux")
            EXPECTED_SHA256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
            ;;
          "0.17.0:aarch64-linux")
            EXPECTED_SHA256="9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8"
            ;;
          "0.17.0:x86_64-macos")
            EXPECTED_SHA256="4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6"
            ;;
          "0.17.0:aarch64-macos")
            EXPECTED_SHA256="b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"
            ;;
          *)
            echo "Error: No pinned SHA-256 checksum for Zig ${VERSION} (${ARCH}-${PLATFORM})"
            exit 1
            ;;
        esac

        if command -v sha256sum &> /dev/null; then
          echo "${EXPECTED_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
        else
          echo "${EXPECTED_SHA256}  /tmp/${TARBALL}" | shasum -a 256 -c -
        fi

        # Extract to home directory
        mkdir -p ~/zig
        tar -xf "/tmp/${TARBALL}" -C ~/zig --strip-components=1

        echo "Zig ${VERSION} installed to ~/zig"

    - name: Add Zig to PATH
      shell: bash
      run: |
        echo "$HOME/zig" >> $GITHUB_PATH

    - name: Verify Zig installation
      shell: bash
      run: |
        zig version
