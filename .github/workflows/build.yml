name: build-artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: built
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run fmt && bun run lint && bun run typecheck && bun test
      - name: Publish built branch
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SOURCE_SHA=$(git rev-parse HEAD)
          git fetch origin built || true
          EXPECTED=$(git rev-parse --verify refs/remotes/origin/built 2>/dev/null || true)
          git add -f dist ghostty-vt.wasm
          git commit -m "build: artifacts from ${SOURCE_SHA}" -m "CI: ${RUN_URL}"
          git push --force-with-lease="refs/heads/built:${EXPECTED}" origin HEAD:built
